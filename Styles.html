<style>
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-light: #eff6ff;
        --success: #059669;
        --success-light: #ecfdf5;
        --warning: #d97706;
        --warning-light: #fffbeb;
        --danger: #dc2626;
        --danger-light: #fef2f2;
        --slate-900: #0f172a;
        --slate-800: #1e293b;
        --slate-700: #334155;
        --slate-600: #475569;
        --slate-500: #64748b;
        --slate-200: #e2e8f0;
        --slate-100: #f1f5f9;
        --slate-50: #f8fafc;
        --card-bg: #ffffff;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --radius: 12px;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: #f1f5f9;
        background-image:
            radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.06) 0px, transparent 50%),
            radial-gradient(at 50% 50%, rgba(248, 250, 252, 0.92) 0px, transparent 100%),
            radial-gradient(at 100% 100%, rgba(226, 232, 240, 0.4) 0px, transparent 50%);
        background-attachment: fixed;
        color: var(--slate-800);
        line-height: 1.55;
        min-height: 100vh;
    }

    /* Header Instansi */
    .app-header {
        background: linear-gradient(135deg, #091e3a 0%, #0f2d59 50%, #163e75 100%);
        color: white;
        padding: 0.95rem 1.5rem;
        box-shadow: 0 4px 20px -2px rgba(9, 30, 58, 0.28);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        position: sticky;
        top: 0;
        z-index: 40;
    }

    .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-logo {
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .brand-text h1 {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #ffffff;
    }

    .brand-text p {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 2px;
    }

    .user-nav {
        display: flex;
        align-items: center;
    }

    .user-stacked-capsule {
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.20);
        padding: 6px 12px;
        border-radius: 14px;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .user-stacked-capsule:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.30);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .user-capsule-profile {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
        width: 100%;
    }

    .user-avatar-badge {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(56, 189, 248, 0.45);
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .user-capsule-name {
        color: #ffffff;
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: -0.01em;
    }

    .user-capsule-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        width: 100%;
        padding-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .user-capsule-btn {
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #f1f5f9;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
        line-height: 1.3;
    }

    .user-btn-manage {
        background: rgba(56, 189, 248, 0.16);
        color: #bae6fd;
        border: 1px solid rgba(56, 189, 248, 0.32);
    }

    .user-btn-manage:hover {
        background: rgba(56, 189, 248, 0.32);
        color: #ffffff;
        border-color: rgba(56, 189, 248, 0.55);
        box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
        transform: translateY(-1px);
    }

    .user-btn-manage.active {
        background: #0284c7;
        color: #ffffff;
        border-color: #38bdf8;
        box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    .user-btn-logout {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .user-btn-logout:hover {
        background: rgba(239, 68, 68, 0.24);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.4);
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
        transform: translateY(-1px);
    }

    .user-btn-logout:active, .user-btn-manage:active {
        transform: translateY(0);
    }

    .user-action-divider {
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.22);
        margin: 0 1px;
    }

    .user-unified-capsule {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 4px 6px 4px 12px;
        border-radius: 26px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .user-unified-capsule:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.32);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .user-capsule-profile {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .user-avatar-badge {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(56, 189, 248, 0.45);
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .user-capsule-name {
        color: #ffffff;
        font-weight: 600;
        font-size: 0.825rem;
        letter-spacing: -0.01em;
    }

    .user-capsule-divider {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.22);
        margin: 0 4px;
    }

    .user-capsule-logout {
        border: none;
        background: transparent;
        color: #e2e8f0;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
    }

    .user-capsule-logout:hover {
        background: rgba(239, 68, 68, 0.22);
        color: #fca5a5;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2);
        transform: translateY(-1px);
    }

    .user-capsule-logout:active {
        transform: translateY(0);
        background: rgba(239, 68, 68, 0.35);
    }

    .user-badge {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .role-pill {
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.7rem;
        text-transform: uppercase;
    }

    .role-admin {
        background: #6366f1;
        color: white;
    }

    .role-operator {
        background: #0ea5e9;
        color: white;
    }

    .role-pejabat {
        background: #10b981;
        color: white;
    }

    /* Navigation Tabs */
    .nav-bar {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.85);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
        padding: 0 1.5rem;
        position: sticky;
        top: 67px;
        z-index: 30;
    }

    .nav-tabs {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
        overflow-x: auto;
    }

    .nav-tab {
        padding: 12px 18px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--slate-600);
        border: none;
        background: transparent;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .nav-tab:hover {
        color: var(--primary);
    }

    .nav-tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
    }

    .tab-badge {
        background: #ef4444;
        color: white;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: 700;
    }

    /* Main Container */
    .main-wrapper {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 1.5rem;
    }

    /* Cards */
    .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px solid rgba(226, 232, 240, 0.85);
        box-shadow: var(--shadow-md);
        padding: 26px 28px;
        margin-bottom: 24px;
        transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--slate-100);
        padding-bottom: 14px;
    }

    .card-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--slate-800);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Dashboard Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: white;
        padding: 22px;
        border-radius: var(--radius);
        border: 1px solid rgba(226, 232, 240, 0.85);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }

    .stat-val {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--slate-800);
    }

    .stat-lbl {
        font-size: 0.8rem;
        color: var(--slate-500);
        font-weight: 500;
    }

    /* Buttons */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
    }

    .btn-primary {
        background: var(--primary);
        color: white;
    }

    .btn-primary:hover {
        background: var(--primary-hover);
    }

    .btn-success {
        background: var(--success);
        color: white;
    }

    .btn-success:hover {
        background: #047857;
    }

    .btn-danger {
        background: var(--danger);
        color: white;
    }

    .btn-danger:hover {
        background: #b91c1c;
    }

    .btn-secondary {
        background: var(--slate-100);
        color: var(--slate-700);
        border: 1px solid var(--slate-200);
    }

    .btn-secondary:hover {
        background: var(--slate-200);
    }

    .btn-sm {
        padding: 6px 12px;
        font-size: 0.775rem;
    }

    /* Form Elements */
    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        font-size: 0.825rem;
        font-weight: 600;
        color: var(--slate-700);
        margin-bottom: 6px;
    }

    .form-control {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.875rem;
        border: 1px solid var(--slate-200);
        border-radius: 8px;
        background: white;
        color: var(--slate-800);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }

    /* Tables */
    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        text-align: left;
    }

    .data-table th {
        background: var(--slate-50);
        padding: 12px 16px;
        font-weight: 600;
        color: var(--slate-600);
        border-bottom: 1px solid var(--slate-200);
    }

    .data-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--slate-100);
        vertical-align: middle;
    }

    .data-table tr:hover td {
        background-color: #f8fafc;
    }

    /* Badges Status */
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .badge-menunggu {
        background: #fef3c7;
        color: #92400e;
    }

    .badge-ditandatangani {
        background: #d1fae5;
        color: #065f46;
    }

    .badge-draft {
        background: #e2e8f0;
        color: #334155;
    }

    .badge-ditolak {
        background: #fee2e2;
        color: #991b1b;
    }

    /* Verifikasi Sertifikat Publik Box */
    .verify-card {
        max-width: 720px;
        margin: 40px auto;
        background: white;
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--slate-200);
        overflow: hidden;
    }

    .verify-header {
        background: linear-gradient(135deg, #065f46 0%, #059669 100%);
        color: white;
        padding: 32px 24px;
        text-align: center;
    }

    .verify-header.invalid {
        background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
    }

    .verify-icon-box {
        width: 68px;
        height: 68px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin: 0 auto 16px auto;
        border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .verify-header h2 {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    .verify-header p {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 4px;
    }

    .verify-body {
        padding: 32px 28px;
    }

    .cert-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px dashed var(--slate-200);
        font-size: 0.875rem;
    }

    .cert-label {
        color: var(--slate-500);
        font-weight: 500;
    }

    .cert-value {
        color: var(--slate-800);
        font-weight: 600;
        text-align: right;
        max-width: 60%;
    }

    .hash-box {
        background: var(--slate-50);
        border: 1px solid var(--slate-200);
        padding: 10px 14px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.75rem;
        color: var(--slate-600);
        word-break: break-all;
        margin-top: 14px;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px 16px;
        overflow-y: auto;
    }

    .modal-box {
        background: white;
        border-radius: 16px;
        max-width: 480px;
        width: 100%;
        padding: 24px;
        box-shadow: var(--shadow-lg);
        animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        margin: auto;
        position: relative;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        flex-shrink: 0;
    }

    .modal-body {
        overflow-y: auto;
        padding-right: 6px;
        flex: 1 1 auto;
        min-height: 0;
    }

    .modal-body::-webkit-scrollbar {
        width: 6px;
    }

    .modal-body::-webkit-scrollbar-track {
        background: var(--slate-100);
        border-radius: 4px;
    }

    .modal-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    .modal-body::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--slate-100);
        flex-shrink: 0;
    }

    @keyframes modalPop {
        from {
            opacity: 0;
            transform: scale(0.95);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Modal Preview Surat — Ukuran besar & tampilan seolah PDF Print Preview */
    .modal-box-preview {
        width: 95vw;
        max-width: 1000px;
        height: 92vh;
        max-height: 920px;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .modal-box-preview .modal-header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--slate-200);
        margin-bottom: 0;
        flex-shrink: 0;
        background: #ffffff;
    }

    .modal-box-preview .modal-body {
        padding: 0;
        flex: 1;
        background: #525659;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .modal-box-preview .modal-footer {
        padding: 10px 20px;
        margin-top: 0;
        border-top: 1px solid var(--slate-200);
        align-items: center;
        flex-shrink: 0;
        background: #ffffff;
    }

    /* Multi-Page PDF Preview Scroll & Page Cards */
    #previewPdfWrap {
        scroll-behavior: smooth;
    }
    #previewPdfWrap::-webkit-scrollbar {
        width: 10px;
    }
    #previewPdfWrap::-webkit-scrollbar-track {
        background: #3f4245;
    }
    #previewPdfWrap::-webkit-scrollbar-thumb {
        background: #64748b;
        border-radius: 5px;
    }
    #previewPdfWrap::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
    .preview-page-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .preview-btn-action {
        transition: all 0.2s ease;
    }
    .preview-btn-action:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }

    /* Surat Masuk Modul Styles */
    .badge-kategori-dinas {
        background: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
    }
    .badge-kategori-undangan {
        background: #fef3c7;
        color: #b45309;
        border: 1px solid #fde68a;
    }
    .badge-kategori-edaran {

        color: #15803d;
        border: 1px solid #bbf7d0;
    }
    .badge-kategori-laporan {
        background: #ede9fe;
        color: #6d28d9;
        border: 1px solid #ddd6fe;

    .modal-title {

    }

    /* Toast Notification */
    .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .toast {
        padding: 12px 20px;
        background: #1e293b;
        color: white;
        border-radius: 8px;
        box-shadow: var(--shadow-lg);
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }

        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
        .header-container {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .cert-row {
            flex-direction: column;
            gap: 4px;
        }

        .cert-value {
            max-width: 100%;
            text-align: left;
        }
    }

    /* ====== STYLE KHUSUS MODE UPLOAD PDF & STEMPEL TTE ====== */
    .doc-type-selector {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        padding: 6px;
        background: #f1f5f9;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
    }

    .btn-mode {
        flex: 1;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: transparent;
        color: #64748b;
        transition: all 0.2s ease;
    }

    .btn-mode:hover {
        color: #1e293b;
        background: rgba(255, 255, 255, 0.5);
    }

    .btn-mode.active {
        background: #ffffff;
        color: var(--primary);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        border: 1px solid #bfdbfe;
    }

    .pdf-dropzone {
        border: 2px dashed #93c5fd;
        background: #f8fafc;
        border-radius: 12px;
        padding: 32px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .pdf-dropzone:hover,
    .pdf-dropzone.dragover {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .pdf-preview-container {
        background: #334155;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: auto;
    }

    .pdf-canvas-wrap {
        position: relative;
        display: inline-block;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        background: #ffffff;
        border-radius: 4px;
        user-select: none;
        line-height: 0;
    }

    .pdf-canvas-wrap canvas {
        display: block;
        max-width: 100%;
        height: auto;
    }

    .tte-stamp-box {
        position: absolute;
        width: 88px;
        height: 88px;
        min-width: 48px;
        min-height: 48px;
        max-width: 240px;
        max-height: 240px;
        background: rgba(16, 185, 129, 0.18);
        border: 2.5px dashed #059669;
        border-radius: 8px;
        cursor: grab;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #065f46;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        user-select: none;
        z-index: 10;
        backdrop-filter: blur(1px);
        transition: border-color 0.15s, box-shadow 0.15s;
        box-sizing: border-box;
        overflow: visible;
    }

    .tte-stamp-box:active {
        cursor: grabbing;
        box-shadow: 0 6px 18px rgba(5, 150, 105, 0.4);
        border-color: #047857;
    }

    .tte-stamp-box .stamp-icon {
        font-size: 26px;
        line-height: 1;
        margin-bottom: 2px;
        pointer-events: none;
        transition: font-size 0.15s;
    }

    .tte-stamp-box .stamp-label {
        line-height: 1.2;
        text-shadow: 0 1px 1px #fff;
        pointer-events: none;
        font-size: 10px;
    }

    /* Tuas Tarik Ukuran di Sudut Kanan-Bawah */
    .stamp-resize-handle {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 20px;
        height: 20px;
        cursor: nwse-resize;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        border: 2px solid #059669;
        border-radius: 4px 0 6px 0;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        z-index: 25;
        touch-action: none;
        transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
    }

    .stamp-resize-handle:hover,
    .stamp-resize-handle:active {
        background: #ecfdf5;
        border-color: #047857;
        transform: scale(1.18);
        box-shadow: 0 3px 8px rgba(5, 150, 105, 0.4);
    }

    /* Kontrol Stepper & Preset Ukuran */
    .btn-size-step {
        border: none;
        background: #ffffff;
        color: #334155;
        padding: 4px 8px;
        font-size: 0.72rem;
        cursor: pointer;
        transition: background 0.15s;
    }

    .btn-size-step:hover {
        background: #f1f5f9;
        color: #0284c7;
    }

    .btn-size-step:first-child {
        border-right: 1px solid #e2e8f0;
    }

    .preset-sizes-wrap {
        display: inline-flex;
        gap: 4px;
        align-items: center;
    }

    .btn-size-preset {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #475569;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .btn-size-preset:hover {
        border-color: #0284c7;
        color: #0284c7;
        background: #f0f9ff;
    }

    .btn-size-preset.active {
        background: #0284c7;
        border-color: #0284c7;
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(2, 132, 199, 0.3);
    }

    .pdf-page-pill {
        padding: 4px 10px;
        background: #334155;
        color: #cbd5e1;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid #475569;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.15s ease;
    }

    .pdf-page-pill:hover {
        background: #475569;
        color: #ffffff;
    }

    .pdf-page-pill.active {
        background: #2563eb;
        color: #ffffff;
        border-color: #60a5fa;
        font-weight: 600;
    }

    .pdf-page-pill .pill-tte-badge {
        background: #059669;
        color: #ffffff;
        font-size: 9px;
        padding: 1px 4px;
        border-radius: 4px;
        font-weight: 700;
    }

    /* ==================== DASHBOARD ANIMATIONS & INTERACTIVE EFFECTS ==================== */
    
    /* 1. Staggered Entrance Animations */
    @keyframes dashFadeUp {
        from {
            opacity: 0;
            transform: translateY(18px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .anim-fade-up {
        animation: dashFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .anim-delay-1 { animation-delay: 0.08s; }
    .anim-delay-2 { animation-delay: 0.16s; }
    .anim-delay-3 { animation-delay: 0.24s; }
    .anim-delay-4 { animation-delay: 0.32s; }
    .anim-delay-5 { animation-delay: 0.40s; }

    /* 2. Floating Ambient Orbs for Hero Banner */
    @keyframes orbFloat {
        0%, 100% {
            transform: translate(0, 0) scale(1);
        }
        50% {
            transform: translate(12px, -10px) scale(1.08);
        }
    }

    @keyframes orbFloatReverse {
        0%, 100% {
            transform: translate(0, 0) scale(1);
        }
        50% {
            transform: translate(-14px, 8px) scale(1.1);
        }
    }

    .floating-orb-1 {
        animation: orbFloat 9s ease-in-out infinite;
    }

    .floating-orb-2 {
        animation: orbFloatReverse 11s ease-in-out infinite;
    }

    /* 3. Stat Card Hover Glows & Icon Micro-Interactions */
    .stat-card {
        cursor: default;
        position: relative;
        overflow: hidden;
    }

    .stat-card:hover {
        transform: translateY(-4px);
    }

    .stat-icon {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .stat-card:hover .stat-icon {
        transform: scale(1.15) rotate(4deg);
    }

    /* Themed Glows */
    .stat-card.stat-blue:hover {
        border-color: #7dd3fc;
        box-shadow: 0 12px 28px -4px rgba(2, 132, 199, 0.2), 0 4px 10px rgba(2, 132, 199, 0.08);
    }

    .stat-card.stat-amber:hover {
        border-color: #fde68a;
        box-shadow: 0 12px 28px -4px rgba(245, 158, 11, 0.2), 0 4px 10px rgba(245, 158, 11, 0.08);
    }

    .stat-card.stat-emerald:hover {
        border-color: #a7f3d0;
        box-shadow: 0 12px 28px -4px rgba(16, 185, 129, 0.2), 0 4px 10px rgba(16, 185, 129, 0.08);
    }

    .stat-card.stat-rose:hover {
        border-color: #fecdd3;
        box-shadow: 0 12px 28px -4px rgba(225, 29, 72, 0.2), 0 4px 10px rgba(225, 29, 72, 0.08);
    }

    /* 4. Live Pulsing Indicator Dot */
    @keyframes pulseActiveDot {
        0%, 100% {
            transform: scale(1);
            opacity: 1;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
        }
        50% {
            transform: scale(1.15);
            opacity: 0.9;
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
        }
    }

    .live-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        display: inline-block;
        animation: pulseActiveDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        flex-shrink: 0;
    }

    /* 5. Bell Notification Chime */
    @keyframes bellChime {
        0%, 80%, 100% {
            transform: rotate(0deg);
        }
        84% {
            transform: rotate(14deg);
        }
        88% {
            transform: rotate(-12deg);
        }
        92% {
            transform: rotate(10deg);
        }
        96% {
            transform: rotate(-6deg);
        }
    }

    .bell-anim {
        display: inline-block;
        animation: bellChime 4.5s ease-in-out infinite;
        transform-origin: top center;
    }

    /* 6. Step Card Interactive Hover */
    .guide-step-card {
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        cursor: default;
    }

    .guide-step-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.08) !important;
    }

    .guide-step-card .step-badge {
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .guide-step-card:hover .step-badge {
        transform: scale(1.12);
    }

    /* 7. Action Button Hover & Click Ripple Feedback */
    .btn-tactile {
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    .btn-tactile:hover {
        transform: translateY(-2.5px);
    }

    .btn-tactile:active {
        transform: translateY(0.5px) scale(0.98) !important;
    }

    /* 8. User Management Styles */
    .user-mgmt-header {

        flex-wrap: wrap;

    .user-table-container {

    .user-name-cell {

    .badge-status-pill {
        display: inline-flex;

    .pejabat-collapsible-box {

    /* Status Disposisi Badges */
    .badge-disposisi-pending {
        background: #fffbeb;
        color: #d97706;
        border: 1px solid #fde68a;
    }
    .badge-disposisi-done {
        background: #ecfdf5;
        color: #059669;
        border: 1px solid #a7f3d0;
    }

    /* Print Styles for Lembar Disposisi Surat Masuk */
    @media print {
        body * {
            visibility: hidden;
        }
        #modalLembarDisposisi,
        #modalLembarDisposisi * {
            visibility: visible;
        }
        #modalLembarDisposisi {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: auto !important;
            background: #ffffff !important;
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
        }
        #modalLembarDisposisi .modal-header,
        #modalLembarDisposisi .modal-header * {
            display: none !important;
        }
        #modalLembarDisposisi .modal-box {
            max-width: 100% !important;
            width: 100% !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }
        #printAreaLembarDisposisi {
            border: 2px solid #000000 !important;
            padding: 20px !important;
            margin: 0 auto !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
        .anim-fade-up, .floating-orb-1, .floating-orb-2, .live-status-dot, .bell-anim {
            animation: none !important;
        }
        .stat-card:hover, .guide-step-card:hover, .btn-tactile:hover {
            transform: none !important;
        }
    }

    /* ====================================================================
       EXECUTIVE MODERN LEFT SIDEBAR & DASHBOARD ARCHITECTURE

        min-height: 100vh;
        background: #f8fafc;
