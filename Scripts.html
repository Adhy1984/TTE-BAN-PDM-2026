    /**
     * Menampilkan tanggal dan jam surat dalam waktu nyata (real-time WITA/lokal),
     * menghilangkan artefak pergeseran timezone mundur 1 jam (23:00:00) atau tengah malam (00:00:00).
     */
    function formatRealDateTime(dateStr, createdAtStr) {
        if (!dateStr && !createdAtStr) return '—';
        var tgl = String(dateStr || '').trim();
        var crt = String(createdAtStr || '').trim();

        // 1. Ekstrak jam riil dari createdAt jika tersedia
        var realClock = '';
        if (crt) {
            var m = crt.match(/(?:T|\s)(\d{1,2}:\d{2}(?::\d{2})?)/);
            if (m) {
                var cTime = m[1];
                if (!cTime.startsWith('23:00') && !cTime.startsWith('00:00')) {
                    realClock = (cTime.length === 5) ? (cTime + ':00') : cTime;
                }
            } else {
                var dObj = new Date(crt);
                if (!isNaN(dObj.getTime())) {
                    var hh = String(dObj.getHours()).padStart(2, '0');
                    var mm = String(dObj.getMinutes()).padStart(2, '0');
                    var ss = String(dObj.getSeconds()).padStart(2, '0');
                    var testTime = hh + ':' + mm + ':' + ss;
                    if (testTime !== '23:00:00' && testTime !== '00:00:00') {
                        realClock = testTime;
                    }
                }
            }
        }

        // 2. Normalisasi tanggal surat dari artefak mundur 23:00:00 atau 00:00:00
        var cleanDate = tgl;
        var tMatch = tgl.match(/^(\d{4}-\d{2}-\d{2})(?:[T\s](\d{1,2}:\d{2}(?::\d{2})?))?/);
        if (tMatch) {
            var datePart = tMatch[1];
            var timePart = tMatch[2];
            if (timePart) {
                if (timePart.startsWith('23:00')) {
                    // Artefak timezone GMT+8 terekspor ke GMT+7 (00:00:00 - 1 jam = 23:00:00 hari sebelumnya)
                    // Kembalikan ke tanggal sebenarnya (+1 hari)
                    try {
                        var dp = datePart.split('-');
                        var dt = new Date(parseInt(dp[0], 10), parseInt(dp[1], 10) - 1, parseInt(dp[2], 10));
                        dt.setDate(dt.getDate() + 1);
                        var yy = dt.getFullYear();
                        var mo = String(dt.getMonth() + 1).padStart(2, '0');
                        var da = String(dt.getDate()).padStart(2, '0');
                        cleanDate = yy + '-' + mo + '-' + da;
                    } catch (e) {
                        cleanDate = datePart;
                    }
                } else if (timePart.startsWith('00:00')) {
                    cleanDate = datePart;
                } else {
                    return tgl;
                }
            } else {
                cleanDate = datePart;
            }
        }

        // 3. Gabungkan tanggal bersih dengan jam riil jika ada
        if (realClock) {
            return cleanDate + ' ' + realClock;
        }

        return cleanDate;
    }

    /**
     * Mengunduh berkas PDF resmi secara nyata langsung ke perangkat pengguna via Blob (Anti-Popup Blocker)
     */
    function downloadOfficialPdf() {
        if (!_currentDetailDoc || !_currentDetailDoc.id_dokumen) {
            showToast('Dokumen surat tidak ditemukan.', 'error');
            return;
        }

        var btn = document.getElementById('detBtnDownload');
        var origHtml = btn ? btn.innerHTML : '⬇️ Unduh PDF';
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Menyiapkan File...';
        }

        showToast('Sedang menyiapkan unduhan file PDF...', 'info');

        google.script.run
            .withSuccessHandler(function (res) {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = origHtml;
                }
                if (res && res.success) {
                    // Update cache dokumen
                    if (res.viewUrl) {
                        _currentDetailDoc.pdf_url = res.viewUrl;
                        var viewBtn = document.getElementById('detBtnView');
                        if (viewBtn) { viewBtn.href = res.viewUrl; viewBtn.onclick = null; }
                    }
                    if (res.pdfId) _currentDetailDoc.pdf_id = res.pdfId;

                    var safeNomor = (_currentDetailDoc.nomor_surat || "SURAT").replace(/[\/\\?%*:|"<>]/g, "_");
                    var fileName = res.fileName || ("SURAT_" + safeNomor + "_" + _currentDetailDoc.id_dokumen + ".pdf");

                    if (res.pdfBase64) {
                        // 1. Direct Blob Download (Anti-Popup Blocker 100% Berhasil)
                        var downloaded = triggerPdfBlobDownload(res.pdfBase64, fileName);
                        if (downloaded) {
                            showToast('✅ File PDF berhasil diunduh ke perangkat Anda!', 'success');
                            return;
                        }
                    }

                    // 2. Fallback: Buka downloadUrl jika Base64 tidak tersedia
                    var dlUrl = res.downloadUrl || res.viewUrl;
                    if (dlUrl) {
                        var a = document.createElement('a');
                        a.href = dlUrl;
                        a.target = '_blank';
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        showToast('✅ Berkas PDF sedang diunduh.', 'success');
                    }
                } else {
                    showToast('❌ ' + ((res && res.message) || 'Gagal mengunduh berkas PDF.'), 'error');
                }
            })
            .withFailureHandler(function (err) {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = origHtml;
                }
                showToast('❌ Error: ' + (err && err.message ? err.message : err), 'error');
            })
            .apiGetOrEnsurePdf(APP.token, _currentDetailDoc.id_dokumen);
    }

    /**
     * Konversi Base64 menjadi file Blob dan unduh ke perangkat (Zero-Popup-Blocker)
     */
    function triggerPdfBlobDownload(base64Data, filename) {
        try {
            var rawData = base64Data;
            if (rawData.indexOf('data:application/pdf;base64,') === 0) {
                rawData = rawData.substring(28);
            }
            var byteCharacters = atob(rawData);
            var byteLength = byteCharacters.length;
            var bytes = new Uint8Array(byteLength);
            for (var i = 0; i < byteLength; i++) {
                bytes[i] = byteCharacters.charCodeAt(i);
            }
            var blob = new Blob([bytes], { type: 'application/pdf' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename || 'Surat_Resmi.pdf';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 2000);
            return true;
        } catch (e) {
            console.error('Gagal download blob:', e);
            return false;
        }
    }

            openOfficialPdfDirectView();
        }
    }

        google.script.run

                if (res && res.success && res.url) {

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(res.url).then(function () {

                    } else {

                    }
                } else {
                    showToast('❌ Gagal mendapatkan link: ' + ((res && res.message) || 'Error tidak diketahui'), 'error');
                }
            })
            .withFailureHandler(function (err) {

            })
            .apiGetVerifyUrl(docId);

    /** Fallback copy ke clipboard via textarea (untuk browser yang tidak support Clipboard API) */
    function _fallbackCopyToClipboard(text) {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            ta.style.top = '0';
            ta.style.left = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok) {
                showToast('✅ Link verifikasi berhasil disalin!', 'success');
            } else {
                showToast('⚠️ Tidak bisa salin otomatis. Salin link ini:\n' + text, 'warning');
            }
        } catch (e) {
            showToast('⚠️ Salin link ini secara manual:\n' + text, 'warning');
        }
    }

    /**
     * Membubuhkan QR Code TTE pada dokumen PDF yang diunggah menggunakan PDF-Lib
     */
    async function stampAndFinalizeUploadPdf(res) {
        var btnEl = document.querySelector('#modalPinTte .btn-success');
        try {
            if (typeof PDFLib === 'undefined') {
                throw new Error('Pustaka PDF-Lib tidak tersedia. Mohon periksa koneksi internet Anda.');
            }

            // 1. Decode PDF mentah dari Base64
            var binaryPdf = atob(res.pdfBase64);
            var lenPdf = binaryPdf.length;
            var bytesPdf = new Uint8Array(lenPdf);
            for (var i = 0; i < lenPdf; i++) {
                bytesPdf[i] = binaryPdf.charCodeAt(i);
            }

            var pdfDoc = await PDFLib.PDFDocument.load(bytesPdf);

            // 2. Decode QR-Code PNG dari Base64
            var cleanQrBase64 = res.qrBase64.replace(/^data:image\/[a-z]+;base64,/, '');
            var binaryQr = atob(cleanQrBase64);
            var lenQr = binaryQr.length;
            var bytesQr = new Uint8Array(lenQr);
            for (var j = 0; j < lenQr; j++) {
                bytesQr[j] = binaryQr.charCodeAt(j);
            }

            var qrImage = await pdfDoc.embedPng(bytesQr);

            // 3. Ambil halaman target penandatanganan
            var pages = pdfDoc.getPages();
            var pageIdx = Math.max(0, Math.min((parseInt(res.tte_page) || 1) - 1, pages.length - 1));
            var targetPage = pages[pageIdx];

            // 4. Tempelkan QR-Code pada koordinat dan ukuran yang ditentukan oleh operator
            var qrSize = parseFloat(res.tte_size) || 75;
            targetPage.drawImage(qrImage, {
                x: parseFloat(res.tte_x) || 50,
                y: parseFloat(res.tte_y) || 50,
                width: qrSize,
                height: qrSize
            });

            // 5. Simpan berkas PDF hasil pembubuhan
            var stampedBytes = await pdfDoc.save();

            // Ubah Uint8Array kembali ke string Base64
            var binaryStamped = '';
            var chunk = 8192;
            for (var k = 0; k < stampedBytes.length; k += chunk) {
                binaryStamped += String.fromCharCode.apply(null, stampedBytes.subarray(k, k + chunk));
            }
            var stampedBase64 = btoa(binaryStamped);

            // 6. Kirim ke backend untuk disimpan permanen ke Google Drive
            google.script.run
                .withSuccessHandler(function (saveRes) {
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.textContent = '✅ Tanda Tangani Dokumen';
                    }
                    closePinModal();
                    if (saveRes && saveRes.success) {
                        showToast('🎉 Dokumen PDF berhasil dibubuhi TTE resmi!', 'success');
                        loadApprovalList();
                        loadDashboard();
                        setTimeout(function () {
                            if (saveRes.pdfUrl) {
                                var konfirm = confirm('✅ Dokumen PDF resmi bertanda tangan elektronik telah selesai dan tersimpan di Google Drive!\n\nKlik OK untuk membuka file PDF tersebut.');
                                if (konfirm) window.open(saveRes.pdfUrl, '_blank');
                            }
                        }, 500);
                    } else {
                        showToast('❌ ' + ((saveRes && saveRes.message) || 'Gagal menyimpan berkas TTE.'), 'error');
                    }
                })
                .withFailureHandler(function (errSave) {
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.textContent = '✅ Tanda Tangani Dokumen';
                    }
                    showToast('❌ Error simpan: ' + (errSave && errSave.message ? errSave.message : errSave), 'error');
                })
                .apiSaveSignedUploadPdf(APP.token, res.docId, stampedBase64, res.verifyUrl);

        } catch (errStamping) {
            if (btnEl) {
                btnEl.disabled = false;
                btnEl.textContent = '✅ Tanda Tangani Dokumen';
            }
            showToast('❌ Gagal memproses penempelan TTE: ' + errStamping.message, 'error');
        }
    }

    // State untuk modal pratinjau dokumen PDF luar
    var _modalPdfDoc = null;
    var _modalPdfCurPage = 1;
    var _modalPdfTotalPages = 1;
    var _modalPdfTtePage = 1;
    var _modalPdfTteX = 0;
    var _modalPdfTteY = 0;
    var _modalPdfTteSize = 75;
    var _modalPdfIsSuratMasuk = false;
    var _modalRenderedPages = {};
    var _modalPdfObserver = null;
    var _modalPdfScrollListening = false;
    var _previewScrollTicking = false;

    /**
     * Membuka modal pratinjau surat (read-only) untuk dokumen tipe Template atau UPLOAD_PDF.
     * @param {string} docId      - ID dokumen surat yang akan dipratinjau
     * @param {string} nomorSurat - Nomor surat untuk label di header modal (opsional)
     */
    function openPreviewModal(docId, nomorSurat) {
        if (!docId) {
            showToast('ID Dokumen tidak ditemukan.', 'error');
            return;
        }

        // Reset tampilan modal
        var spinner = document.getElementById('previewLoadingSpinner');
        var iframe = document.getElementById('previewIframe');
        var pdfWrap = document.getElementById('previewPdfWrap');
        var label = document.getElementById('previewNomorSuratLabel');
        var banner = document.getElementById('previewModalBanner');
        var toolbar = document.getElementById('previewModalToolbar');

        if (spinner) spinner.style.display = 'flex';
        if (iframe) { iframe.style.display = 'none'; iframe.srcdoc = ''; }
        if (pdfWrap) { pdfWrap.style.display = 'none'; }
        if (banner) { banner.style.display = 'none'; }
        if (toolbar) { toolbar.style.display = 'none'; }
        if (label) label.textContent = nomorSurat ? '— ' + nomorSurat : '';

        // Tampilkan modal
        document.getElementById('modalPreviewSurat').style.display = 'flex';

        // Panggil backend untuk mendapatkan HTML pratinjau (read-only)
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) {
                    if (spinner) spinner.style.display = 'none';
                    showToast('Gagal memuat pratinjau: ' + ((res && res.message) || 'Error tidak diketahui'), 'error');
                    return;
                }
                // Perbarui label nomor surat jika tersedia dari server
                if (label && res.nomorSurat) {
                    label.textContent = '— ' + res.nomorSurat;
                }

                // Jika dokumen bertipe UPLOAD_PDF, render pratinjau PDF visual dengan indikator stempel
                if (res.isUploadPdf) {
                    res.isSuratMasuk = false;
                    renderUploadPdfPreviewModal(res);
                    if (spinner) spinner.style.display = 'none';
                    return;
                }

                // Set konten iframe via srcdoc untuk dokumen bertipe Template
                if (iframe) {
                    iframe.srcdoc = res.html;
                    iframe.style.display = 'block';
                }
                if (pdfWrap) pdfWrap.style.display = 'none';
                if (banner) banner.style.display = 'none';
                if (toolbar) toolbar.style.display = 'none';
                if (spinner) spinner.style.display = 'none';
            })
            .withFailureHandler(function (err) {
                if (spinner) spinner.style.display = 'none';
                showToast('Error koneksi: ' + (err && err.message ? err.message : err), 'error');
                document.getElementById('modalPreviewSurat').style.display = 'none';
            })
            .apiGetPreviewHtml(APP.token, docId);
    }

    /**
     * Merender pratinjau dokumen UPLOAD_PDF ke dalam kontainer kanvas modal dengan seluruh halaman bergulir
     */
    function renderUploadPdfPreviewModal(res) {
        var iframe = document.getElementById('previewIframe');
        var pdfWrap = document.getElementById('previewPdfWrap');
        var mainContent = document.getElementById('previewPdfMainContent');
        var errorBox = document.getElementById('previewPdfError');
        var errorMsg = document.getElementById('previewPdfErrorMsg');
        var driveLink = document.getElementById('previewPdfDriveLink');

        if (iframe) iframe.style.display = 'none';
        if (pdfWrap) pdfWrap.style.display = 'block';

        // Bersihkan state & kontainer lama jika ada
        cleanupPreviewModalPdf();

        // Jika tidak ada data base64 PDF (misal file Drive tidak terakses)
        if (!res.pdfBase64) {
            if (mainContent) mainContent.style.display = 'none';
            if (errorBox) errorBox.style.display = 'flex';
            if (errorMsg) errorMsg.textContent = 'Berkas PDF draf belum dapat dibaca dari penyimpanan Google Drive.';
            if (driveLink) {
                if (res.pdfUrl) {
                    driveLink.href = res.pdfUrl;
                    driveLink.style.display = 'inline-block';
                } else {
                    driveLink.style.display = 'none';
                }
            }
            return;
        }

        // Tampilkan konten utama dan sembunyikan error
        if (mainContent) mainContent.style.display = 'flex';
        if (errorBox) errorBox.style.display = 'none';

        if (typeof pdfjsLib === 'undefined') {
            showToast('Pustaka visual PDF.js sedang dimuat, coba sebentar lagi...', 'warning');
            return;
        }

        // Deteksi apakah dokumen adalah Surat Masuk (Pure Read-Only Viewer)
        _modalPdfIsSuratMasuk = (res && res.isSuratMasuk === true);

        var banner = document.getElementById('previewModalBanner');
        var toolbar = document.getElementById('previewModalToolbar');
        var btnJumpTte = document.getElementById('btnPreviewJumpTte');
        var footerNote = document.getElementById('previewModalFooterNote');

        if (toolbar) toolbar.style.display = 'flex';

        if (_modalPdfIsSuratMasuk) {
            // Sembunyikan banner dan tombol penanda stempel TTE untuk surat masuk
            if (banner) banner.style.display = 'none';
            if (btnJumpTte) btnJumpTte.style.display = 'none';
            if (footerNote) footerNote.innerHTML = '📁 <em>Berkas Arsip Surat Masuk (Mode Baca).</em>';
            _modalPdfTtePage = 0;
            _modalPdfTteX = 0;
            _modalPdfTteY = 0;
            _modalPdfTteSize = 0;
        } else {
            // Dokumen draf surat keluar: tampilkan banner dan indikator stempel TTE
            if (banner) banner.style.display = 'flex';
            if (btnJumpTte) btnJumpTte.style.display = 'inline-flex';
            if (footerNote) footerNote.innerHTML = '⚠️ <em>Pratinjau tidak resmi. Dokumen resmi hanya ada setelah pejabat menandatangani secara elektronik.</em>';
            _modalPdfTtePage = parseInt(res.tte_page) || 1;
            _modalPdfTteX = parseFloat(res.tte_x) || 0;
            _modalPdfTteY = parseFloat(res.tte_y) || 0;
            _modalPdfTteSize = parseFloat(res.tte_size) || 75;
        }
        _modalPdfCurPage = 1; // REVISI: Selalu mulai dari Halaman 1 agar pejabat dapat mereview dari awal dokumen!

        var ttePageLabel = document.getElementById('previewModalTtePageNum');
        if (ttePageLabel) ttePageLabel.textContent = _modalPdfTtePage;

        var btnTtePageNum = document.getElementById('previewModalBtnTtePageNum');
        if (btnTtePageNum) btnTtePageNum.textContent = _modalPdfTtePage;

        try {
            var rawData = window.atob(res.pdfBase64);
            var rawLen = rawData.length;
            var bytes = new Uint8Array(rawLen);
            for (var i = 0; i < rawLen; i++) {
                bytes[i] = rawData.charCodeAt(i);
            }

            pdfjsLib.getDocument({ data: bytes }).promise.then(function (doc) {
                _modalPdfDoc = doc;
                _modalPdfTotalPages = doc.numPages;

                var totalPagesLabel = document.getElementById('previewModalTotalPages');
                if (totalPagesLabel) totalPagesLabel.textContent = _modalPdfTotalPages;

                var bannerTotal = document.getElementById('previewModalBannerTotalPages');
                if (bannerTotal) bannerTotal.textContent = _modalPdfTotalPages;

                var inputPage = document.getElementById('previewModalInputPage');
                if (inputPage) {
                    inputPage.value = 1;
                    inputPage.max = _modalPdfTotalPages;
                }

                // Bangun seluruh lembar halaman (multi-page container)
                buildPreviewModalPagesContainer();

            }).catch(function (err) {
                if (mainContent) mainContent.style.display = 'none';
                if (errorBox) errorBox.style.display = 'flex';
                if (errorMsg) errorMsg.textContent = 'Gagal memuat dokumen PDF: ' + err.message;
                if (driveLink && res.pdfUrl) {
                    driveLink.href = res.pdfUrl;
                    driveLink.style.display = 'inline-block';
                }
            });
        } catch (e) {
            if (mainContent) mainContent.style.display = 'none';
            if (errorBox) errorBox.style.display = 'flex';
            if (errorMsg) errorMsg.textContent = 'Gagal mendekode berkas PDF: ' + e.message;
        }
    }

    /**
     * Membangun daftar kontainer halaman (page cards) untuk seluruh halaman PDF
     */
    function buildPreviewModalPagesContainer() {
        var container = document.getElementById('previewModalPagesContainer');
        var wrap = document.getElementById('previewPdfWrap');
        if (!container || !_modalPdfDoc) return;

        container.innerHTML = '';
        _modalRenderedPages = {};

        // Buat observer lazy-loading jika didukung browser
        if ('IntersectionObserver' in window) {
            _modalPdfObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        var pageNum = parseInt(entry.target.getAttribute('data-page-num'), 10);
                        if (pageNum && !_modalRenderedPages[pageNum]) {
                            renderPreviewModalPage(pageNum);
                        }
                    }
                });
            }, {
                root: wrap,
                rootMargin: '600px 0px', // Pre-render 600px sebelum halaman terlihat
                threshold: 0.01
            });
        }

        // Loop buat struktur kartu setiap halaman dari 1 sampai totalPages
        for (var p = 1; p <= _modalPdfTotalPages; p++) {
            var isTte = !_modalPdfIsSuratMasuk && (p === _modalPdfTtePage);
            var card = document.createElement('div');
            card.id = 'previewPageCard_' + p;
            card.className = 'preview-page-card';
            card.setAttribute('data-page-num', p);
            card.style.cssText = 'position:relative;width:100%;max-width:740px;background:#ffffff;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.35);overflow:hidden;box-sizing:border-box;margin-bottom:20px;';

            var headerHtml = '<div style="background:#1e293b;color:#cbd5e1;font-size:11px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;user-select:none;">' +
                '<span style="font-weight:600;display:flex;align-items:center;gap:6px;">📄 Halaman ' + p + ' dari ' + _modalPdfTotalPages + '</span>' +
                (isTte ? '<span style="background:rgba(16,185,129,0.2);color:#34d399;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid rgba(52,211,153,0.35);font-size:10.5px;">✅ Posisi Stempel TTE</span>' : '') +
                '</div>';

            var innerHtml = '<div id="previewPageInner_' + p + '" style="position:relative;width:100%;line-height:0;min-height:350px;background:#f8fafc;display:flex;align-items:center;justify-content:center;">' +
                '<div id="previewPageLoader_' + p + '" style="position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;gap:6px;">' +
                '<div style="font-size:22px;animation:spin 1.2s linear infinite;">⏳</div>' +
                '<span>Memuat halaman ' + p + '...</span>' +
                '</div>' +
                '<canvas id="previewModalCanvas_' + p + '" style="display:block;width:100%;height:auto;"></canvas>' +
                (isTte ? '<div id="previewModalStampBox" style="position:absolute;width:75px;height:75px;border:2.5px dashed #059669;background:rgba(16,185,129,0.22);border-radius:8px;display:none;flex-direction:column;align-items:center;justify-content:center;color:#065f46;font-size:10px;font-weight:700;text-align:center;z-index:10;box-shadow:0 3px 10px rgba(5,150,105,0.35);pointer-events:none;">' +
                '<span style="font-size:20px;">📱</span><span style="line-height:1.2;margin-top:2px;">POSISI TTE</span></div>' : '') +
                '</div>';

            card.innerHTML = headerHtml + innerHtml;
            container.appendChild(card);

            if (_modalPdfObserver) {
                _modalPdfObserver.observe(card);
            }
        }

        // Render Halaman 1 langsung seketika
        renderPreviewModalPage(1);

        // Jika tidak mendukung IntersectionObserver, render 3 halaman awal
        if (!_modalPdfObserver) {
            if (_modalPdfTotalPages >= 2) renderPreviewModalPage(2);
            if (_modalPdfTotalPages >= 3) renderPreviewModalPage(3);
        }

        // Pasang pendengar scroll untuk memperbarui nomor halaman aktif di toolbar
        if (!_modalPdfScrollListening && wrap) {
            _modalPdfScrollListening = true;
            wrap.addEventListener('scroll', onPreviewModalScroll, { passive: true });
        }

        // Reset posisi scroll ke paling atas
        if (wrap) wrap.scrollTop = 0;
        updatePreviewToolbarNav();
    }

    /**
     * Merender spesifik lembar halaman ke kanvasnya masing-masing
     */
    function renderPreviewModalPage(pageNum) {
        if (!_modalPdfDoc || _modalRenderedPages[pageNum]) return;
        _modalRenderedPages[pageNum] = true;

        var canvas = document.getElementById('previewModalCanvas_' + pageNum);
        var loader = document.getElementById('previewPageLoader_' + pageNum);
        var inner = document.getElementById('previewPageInner_' + pageNum);
        var wrap = document.getElementById('previewPdfWrap');
        if (!canvas) return;

        _modalPdfDoc.getPage(pageNum).then(function (page) {
            var unscaledViewport = page.getViewport({ scale: 1.0 });
            var pdfW = unscaledViewport.width;
            var pdfH = unscaledViewport.height;

            // Skala kanvas disesuaikan dengan modal pratinjau (~740px optimal)
            var containerWidth = 740;
            if (wrap && wrap.clientWidth > 100) {
                containerWidth = Math.min(wrap.clientWidth - 40, 740);
            }
            var scale = containerWidth / pdfW;
            if (scale > 1.8) scale = 1.8;
            if (scale < 0.5) scale = 0.5;

            var viewport = page.getViewport({ scale: scale });
            var ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
                if (loader) loader.style.display = 'none';
                if (inner) inner.style.minHeight = 'auto';

                // Khusus halaman stempel TTE, posisikan kotak stempel (hanya untuk dokumen surat keluar)
                if (!_modalPdfIsSuratMasuk && pageNum === _modalPdfTtePage) {
                    var stampBox = document.getElementById('previewModalStampBox');
                    if (stampBox) {
                        stampBox.style.display = 'flex';
                        var qrPt = parseFloat(_modalPdfTteSize) || 75;
                        var stampW = Math.round(qrPt * (canvas.width / pdfW));
                        if (stampW < 40) stampW = 40;
                        var stampH = stampW;
                        stampBox.style.width = stampW + 'px';
                        stampBox.style.height = stampH + 'px';

                        // Hitung posisi pixel kanvas dari koordinat poin PDF (origin PDF kiri-bawah)
                        var stampLeft = Math.round(_modalPdfTteX * (canvas.width / pdfW));
                        var stampTop = Math.round(canvas.height - ((_modalPdfTteY + qrPt) * (canvas.height / pdfH)));

                        // Batasi agar tidak terpotong dari kanvas
                        if (stampLeft < 0) stampLeft = 0;
                        if (stampTop < 0) stampTop = 0;
                        if (stampLeft + stampW > canvas.width) stampLeft = canvas.width - stampW - 5;
                        if (stampTop + stampH > canvas.height) stampTop = canvas.height - stampH - 5;

                        stampBox.style.left = stampLeft + 'px';
                        stampBox.style.top = stampTop + 'px';
                    }
                }
            });
        }).catch(function (err) {
            console.error('Gagal render halaman ' + pageNum + ':', err);
            if (loader) {
                loader.innerHTML = '<span style="color:#ef4444;font-size:12px;">Gagal memuat hal ' + pageNum + '</span>';
            }
        });
    }

    /**
     * Pendengar scroll untuk memperbarui status halaman di toolbar saat membaca
     */
    function onPreviewModalScroll() {
        if (_previewScrollTicking) return;
        _previewScrollTicking = true;
        requestAnimationFrame(function () {
            _previewScrollTicking = false;
            var wrap = document.getElementById('previewPdfWrap');
            if (!wrap || !_modalPdfDoc) return;

            var wrapRect = wrap.getBoundingClientRect();
            var detectedPage = 1;
            var minDiff = Infinity;

            for (var p = 1; p <= _modalPdfTotalPages; p++) {
                var card = document.getElementById('previewPageCard_' + p);
                if (card) {
                    var cardRect = card.getBoundingClientRect();
                    // Jarak antara atas kartu dan atas viewport modal
                    var diff = Math.abs(cardRect.top - wrapRect.top);
                    if (diff < minDiff) {
                        minDiff = diff;
                        detectedPage = p;
                    }
                    // Jika tanpa IntersectionObserver, render kartu yang masuk viewport
                    if (!_modalPdfObserver && !_modalRenderedPages[p]) {
                        if (cardRect.top < wrapRect.bottom + 400 && cardRect.bottom > wrapRect.top - 400) {
                            renderPreviewModalPage(p);
                        }
                    }
                }
            }

            if (detectedPage !== _modalPdfCurPage) {
                _modalPdfCurPage = detectedPage;
                updatePreviewToolbarNav();
            }
        });
    }

    /**
     * Memperbarui status tombol dan input nomor halaman di toolbar
     */
    function updatePreviewToolbarNav() {
        var inputPage = document.getElementById('previewModalInputPage');
        if (inputPage) inputPage.value = _modalPdfCurPage;

        var btnPrev = document.getElementById('btnPreviewModalPrev');
        var btnNext = document.getElementById('btnPreviewModalNext');
        if (btnPrev) btnPrev.disabled = (_modalPdfCurPage <= 1);
        if (btnNext) btnNext.disabled = (_modalPdfCurPage >= _modalPdfTotalPages);
    }

    /**
     * Menggulir layar langsung ke halaman yang dipilih (smooth scroll)
     */
    function previewModalScrollToPage(pageNum) {
        if (!_modalPdfDoc) return;
        if (pageNum < 1) pageNum = 1;
        if (pageNum > _modalPdfTotalPages) pageNum = _modalPdfTotalPages;
        _modalPdfCurPage = pageNum;
        updatePreviewToolbarNav();

        // Pastikan halaman yang dituju langsung dirender
        if (!_modalRenderedPages[pageNum]) {
            renderPreviewModalPage(pageNum);
        }

        var card = document.getElementById('previewPageCard_' + pageNum);
        var wrap = document.getElementById('previewPdfWrap');
        if (card && wrap) {
            var targetTop = card.offsetTop - wrap.offsetTop;
            if (targetTop < 0) targetTop = 0;
            wrap.scrollTo({
                top: targetTop,
                behavior: 'smooth'
            });
        }
    }

    function loadUserManagement() {
        if (!APP.user || APP.user.role !== 'admin') return;

        var loadingEl = document.getElementById('userTableLoading');
        var emptyEl = document.getElementById('userTableEmpty');
        var tbody = document.getElementById('userTableBody');

        if (loadingEl) loadingEl.style.display = 'block';
        if (emptyEl) emptyEl.style.display = 'none';
        if (tbody) tbody.innerHTML = '';

        google.script.run
            .withSuccessHandler(function (res) {
                if (loadingEl) loadingEl.style.display = 'none';
                if (!res || !res.success) {
                    showToast((res && res.message) ? res.message : 'Gagal memuat data pengguna', 'error');
                    return;
                }

                try {
                    _userMgmtData.users = res.users || [];
                    _userMgmtData.pejabatList = res.pejabatList || [];

                    updateUserStats();
                    populateExistingPejabatDropdown();
                    renderUserTable(_userMgmtData.users);
                } catch (e) {
                    console.error('Error saat merender tabel pengguna:', e);
                    showToast('Gagal merender data pengguna: ' + e.message, 'error');
                }
            })
            .withFailureHandler(function (err) {
                if (loadingEl) loadingEl.style.display = 'none';
                showToast('Terjadi kesalahan koneksi saat memuat pengguna: ' + err.message, 'error');
            })
            .apiGetUsers(APP.token);
    }

    function updateUserStats() {
        var total = _userMgmtData.users.length;

        var opCount = 0;
        var pjbCount = 0;

        _userMgmtData.users.forEach(function (u) {

        var elTotal = document.getElementById('statUserTotal');

        if (elTotal) elTotal.textContent = total;

    function filterUserTable() {
        var query = (document.getElementById('searchUserQuery').value || '').toLowerCase().trim();
        var filterRole = (document.getElementById('filterUserRole').value || '').trim();
        var filterStatus = (document.getElementById('filterUserStatus').value || '').trim();

        var filtered = _userMgmtData.users.filter(function (u) {
            var matchQuery = true;
            if (query) {
                var nama = (u.nama || '').toLowerCase();
                var username = (u.username || '').toLowerCase();
                var jabatan = (u.pejabat && u.pejabat.jabatan) ? u.pejabat.jabatan.toLowerCase() : '';
                var nip = (u.pejabat && u.pejabat.nip) ? u.pejabat.nip.toLowerCase() : '';
                matchQuery = (nama.indexOf(query) !== -1 || username.indexOf(query) !== -1 || jabatan.indexOf(query) !== -1 || nip.indexOf(query) !== -1);
            }

            var matchRole = filterRole ? (u.role === filterRole) : true;
            var matchStatus = filterStatus ? (u.status === filterStatus) : true;

            return matchQuery && matchRole && matchStatus;
        });

        renderUserTable(filtered);
    }

    function renderUserTable(list) {
        var tbody = document.getElementById('userTableBody');

        if (emptyEl) emptyEl.style.display = 'none';
        if (table) table.style.display = 'table';

        list.forEach(function (u, idx) {
            var tr = document.createElement('tr');

            // Avatar initial & background gradient by role
            var initials = (u.nama || 'U').substring(0, 2).toUpperCase();

                           u.role === 'pejabat' ? 'linear-gradient(135deg, #10b981, #059669)' :
                           'linear-gradient(135deg, #0ea5e9, #0284c7)';

            var roleLabel = u.role === 'admin' ? 'Administrator' :
                            u.role === 'pejabat' ? 'Pejabat TTE' : 'Operator TU';
            var roleClass = 'role-' + u.role;

            var statusBadge = u.status === 'AKTIF' ?
                '<span class="badge-status-pill status-aktif"><span class="live-status-dot" style="width:6px;height:6px;"></span> AKTIF</span>' :
                '<span class="badge-status-pill status-nonaktif">⚪ NON-AKTIF</span>';

            var pejabatInfo = '—';
            if (u.role === 'pejabat' && u.pejabat) {
                pejabatInfo = '<div style="font-weight:600;color:#0f172a;">' + escapeHtml(u.pejabat.jabatan) + '</div>' +
                    '<div style="font-size:0.75rem;color:#64748b;">NIP: ' + escapeHtml(u.pejabat.nip) + '</div>' +
                    '<div style="font-size:0.72rem;color:#16a34a;margin-top:2px;">🔑 PIN TTE: Terdaftar</div>';

                pejabatInfo = '<span style="color:#d97706;font-size:0.75rem;font-weight:600;">⚠️ Belum Ditautkan</span>';
            }

            var isCurrentAdmin = (APP.user && String(APP.user.id).trim() === String(u.id_user).trim());
            var isSuperAdmin = (String(u.username).trim().toLowerCase() === 'admin');

            var toggleBtnHtml = '';

                var toggleIcon = u.status === 'AKTIF' ? '⛔' : '✅';
                toggleBtnHtml = '<button class="btn btn-secondary btn-sm" onclick="toggleUserStatus(\'' + u.id_user + '\')" title="' + toggleTitle + '" style="padding:4px 8px;font-size:0.78rem;">' + toggleIcon + '</button>';
                deleteBtnHtml = '<button class="btn btn-sm btn-tactile" onclick="deleteUserById(\'' + u.id_user + '\', \'' + escapeHtml(u.nama) + '\')" title="Hapus Akun Pengguna" style="padding:4px 8px;font-size:0.78rem;background:#fee2e2;color:#dc2626;border:1px solid #fecaca;border-radius:6px;cursor:pointer;"><span style="font-size:0.85rem;">🗑️</span></button>';
            }

            tr.innerHTML =
                '<td style="text-align:center;font-weight:600;color:#64748b;">' + (idx + 1) + '</td>' +
                '<td>' +
                    '<div class="user-name-cell">' +
                        '<div class="user-row-avatar" style="background:' + avatarBg + ';">' + initials + '</div>' +
                        '<div>' +
                            '<div style="font-weight:700;color:#0f172a;font-size:0.88rem;">' + escapeHtml(u.nama) + '</div>' +
                            '<div style="font-size:0.75rem;color:#94a3b8;">ID: ' + escapeHtml(u.id_user) + '</div>' +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td><code style="background:#f1f5f9;padding:3px 7px;border-radius:6px;font-size:0.8rem;color:#0369a1;font-weight:600;">' + escapeHtml(u.username) + '</code></td>' +
                '<td><span class="role-pill ' + roleClass + '">' + roleLabel + '</span></td>' +
                '<td>' + pejabatInfo + '</td>' +
                '<td>' + statusBadge + '</td>' +
                '<td style="text-align:center;">' +
                    '<div style="display:inline-flex;gap:6px;">' +
                        '<button class="btn btn-primary btn-sm" onclick="editUserById(\'' + u.id_user + '\')" title="Edit Pengguna" style="padding:4px 10px;font-size:0.78rem;background:#0284c7;border:none;">✏️ Edit</button>' +
                        toggleBtnHtml +

    function openModalUser(isEdit, userObj) {
        var modal = document.getElementById('modalUserForm');
        var form = document.getElementById('formUserMain');
        var title = document.getElementById('modalUserTitle');
        var passReq = document.getElementById('userFormPasswordRequired');
        var passHint = document.getElementById('userFormPasswordHint');

        if (!modal || !form) return;
        form.reset();

        // Reset radio button
        var radioNew = document.querySelector('input[name="pejabatMode"][value="new"]');
        if (radioNew) radioNew.checked = true;
        onPejabatModeChanged();

        if (isEdit && userObj) {
            title.innerHTML = '<span>✏️</span> Edit Pengguna: ' + escapeHtml(userObj.nama);
            document.getElementById('formUserAction').value = 'edit';
            document.getElementById('formUserId').value = userObj.id_user;
            document.getElementById('formOriginalUsername').value = userObj.username;

            document.getElementById('userFormNama').value = userObj.nama || '';
            document.getElementById('userFormUsername').value = userObj.username || '';
            document.getElementById('userFormPassword').value = '';
            document.getElementById('userFormPassword').required = false;
            document.getElementById('userFormRole').value = userObj.role || 'operator';
            document.getElementById('userFormStatus').value = userObj.status || 'AKTIF';

            if (passReq) passReq.style.display = 'none';
            if (passHint) passHint.style.display = 'block';

            if (userObj.role === 'pejabat') {
                document.getElementById('sectionPejabatDetails').classList.remove('hidden');
                if (userObj.pejabat) {
                    document.getElementById('pejabatFormJabatan').value = userObj.pejabat.jabatan || '';
                    document.getElementById('pejabatFormNip').value = userObj.pejabat.nip || '';
                    document.getElementById('pejabatFormPin').value = userObj.pejabat.pin_tte || '';
                    document.getElementById('pejabatFormEmail').value = userObj.pejabat.email || '';
                }
            } else {
                document.getElementById('sectionPejabatDetails').classList.add('hidden');
            }
        } else {
            title.innerHTML = '<span>➕</span> Tambah Pengguna Baru';
            document.getElementById('formUserAction').value = 'create';
            document.getElementById('formUserId').value = '';
            document.getElementById('formOriginalUsername').value = '';

            document.getElementById('userFormPassword').required = true;
            if (passReq) passReq.style.display = 'inline';
            if (passHint) passHint.style.display = 'none';

            document.getElementById('userFormRole').value = 'operator';
            document.getElementById('userFormStatus').value = 'AKTIF';
            document.getElementById('sectionPejabatDetails').classList.add('hidden');
        }

        modal.style.display = 'flex';

    function submitUserForm(e) {
        e.preventDefault();
        var action = document.getElementById('formUserAction').value;
        var userId = document.getElementById('formUserId').value;
        var nama = document.getElementById('userFormNama').value.trim();
        var username = document.getElementById('userFormUsername').value.trim();
        var password = document.getElementById('userFormPassword').value;
        var role = document.getElementById('userFormRole').value;
        var status = document.getElementById('userFormStatus').value;

        if (!nama || !username) {
            showToast('Nama lengkap dan username wajib diisi!', 'warning');
            return;
        }

        if (action === 'create' && (!password || password.length < 4)) {
            showToast('Kata sandi wajib diisi minimal 4 karakter!', 'warning');
            return;
        }

        var modeRadio = document.querySelector('input[name="pejabatMode"]:checked');
        var pejabatMode = modeRadio ? modeRadio.value : 'new';
        var existingPejabatId = document.getElementById('selectExistingPejabat').value;
        var pejabatJabatan = document.getElementById('pejabatFormJabatan').value.trim();
        var pejabatNip = document.getElementById('pejabatFormNip').value.trim();
        var pejabatPin = document.getElementById('pejabatFormPin').value.trim();
        var pejabatEmail = document.getElementById('pejabatFormEmail').value.trim();

        if (role === 'pejabat' && pejabatMode === 'new') {
            if (!pejabatJabatan) {
                showToast('Jabatan resmi pejabat penandatangan wajib diisi!', 'warning');
                return;
            }
            if (!pejabatPin || pejabatPin.length < 4) {
                showToast('PIN TTE pejabat penandatangan wajib diisi minimal 4-6 digit angka!', 'warning');
                return;
            }
        }

        var payload = {
            action: action,
            id_user: userId,
            nama: nama,
            username: username,
            password: password,
            role: role,
            status: status,
            pejabatMode: pejabatMode,
            existingPejabatId: existingPejabatId,
            pejabatJabatan: pejabatJabatan,
            pejabatNip: pejabatNip,
            pejabatPin: pejabatPin,
            pejabatEmail: pejabatEmail
        };

        var btn = document.getElementById('btnSaveUser');
        var origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Menyimpan...';

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                btn.innerHTML = origText;
                if (!res || !res.success) {
                    showToast((res && res.message) ? res.message : 'Gagal menyimpan pengguna', 'error');
                    return;
                }

                showToast(res.message, 'success');
                closeModalUser();
                loadUserManagement();
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                btn.innerHTML = origText;
                showToast('Terjadi kesalahan koneksi: ' + err.message, 'error');
            })
            .apiSaveUser(APP.token, payload);
    }

    var _suratMasukData = [];

    /**
     * Memuat daftar surat masuk dari backend Google Apps Script
     */
    function loadSuratMasuk() {
        var loadingEl = document.getElementById('suratMasukLoading');
        var emptyEl = document.getElementById('suratMasukEmpty');
        var tableWrap = document.getElementById('suratMasukTableWrap');
        var tbody = document.getElementById('suratMasukTableBody');

        if (loadingEl) loadingEl.style.display = 'block';
        if (emptyEl) emptyEl.style.display = 'none';
        if (tableWrap) tableWrap.style.display = 'none';
        if (tbody) tbody.innerHTML = '';

        google.script.run
            .withSuccessHandler(function (res) {
                if (loadingEl) loadingEl.style.display = 'none';
                if (!res || !res.success) {
                    showToast((res && res.message) ? res.message : 'Gagal memuat arsip surat masuk.', 'error');
                    if (emptyEl) emptyEl.style.display = 'block';
                    return;
                }

                _suratMasukData = res.data || [];
                var countTotal = document.getElementById('smCountTotal');
                if (countTotal) countTotal.textContent = _suratMasukData.length;

                filterSuratMasuk();
            })
            .withFailureHandler(function (err) {
                if (loadingEl) loadingEl.style.display = 'none';
                if (emptyEl) emptyEl.style.display = 'block';
                showToast('Error koneksi: ' + (err && err.message ? err.message : err), 'error');
            })
            .apiGetSuratMasuk(APP.token);

    /**
     * Menyaring dan menampilkan data surat masuk berdasarkan pencarian dan filter kategori
     */
    function filterSuratMasuk() {
        var query = (document.getElementById('searchSuratMasuk') ? document.getElementById('searchSuratMasuk').value : '').trim().toLowerCase();
        var kategori = document.getElementById('filterKategoriSuratMasuk') ? document.getElementById('filterKategoriSuratMasuk').value : 'ALL';
        var statusDisp = document.getElementById('filterDisposisiSuratMasuk') ? document.getElementById('filterDisposisiSuratMasuk').value : 'ALL';

        var filtered = _suratMasukData.filter(function (item) {
            var matchKategori = (kategori === 'ALL' || item.kategori === kategori);
            var matchStatus = true;
            var isItemDisposed = (item.status_disposisi === 'SUDAH_DISPOSISI' || (item.disposisi_kepada && String(item.disposisi_kepada).trim() !== ''));
            if (statusDisp === 'SUDAH') {
                matchStatus = isItemDisposed;
            } else if (statusDisp === 'BELUM') {
                matchStatus = !isItemDisposed;
            }
            var matchQuery = true;
            if (query) {
                var noSurat = (item.nomor_surat || '').toLowerCase();
                var pengirim = (item.pengirim || '').toLowerCase();
                var perihal = (item.perihal || '').toLowerCase();
                var ket = (item.keterangan || '').toLowerCase();
                var dispKepada = (item.disposisi_kepada || '').toLowerCase();
                var dispOleh = (item.disposisi_oleh || '').toLowerCase();
                matchQuery = noSurat.indexOf(query) !== -1 ||
                             pengirim.indexOf(query) !== -1 ||
                             perihal.indexOf(query) !== -1 ||
                             ket.indexOf(query) !== -1 ||
                             dispKepada.indexOf(query) !== -1 ||
                             dispOleh.indexOf(query) !== -1;
            }
            return matchKategori && matchStatus && matchQuery;
        });

        var countFiltered = document.getElementById('smCountFiltered');
        if (countFiltered) countFiltered.textContent = filtered.length;

        renderSuratMasukTable(filtered);
    }

    /**
     * Membuka modal formulir unggah surat masuk

    function openModalUploadSuratMasuk() {
        var modal = document.getElementById('modalUploadSuratMasuk');
        var form = document.getElementById('formUploadSuratMasuk');
        var alertEl = document.getElementById('smFormAlert');
        if (form) form.reset();
        if (alertEl) { alertEl.style.display = 'none'; alertEl.textContent = ''; }
        resetSuratMasukFile();

        // Set tanggal default hari ini
        var today = new Date().toISOString().split('T')[0];
        var tglSurat = document.getElementById('smTanggalSurat');
        var tglTerima = document.getElementById('smTanggalTerima');
        if (tglSurat) tglSurat.value = today;
        if (tglTerima) tglTerima.value = today;

        if (modal) modal.style.display = 'flex';

     * Menutup modal formulir unggah surat masuk

    function closeModalUploadSuratMasuk() {

        if (modal) modal.style.display = 'none';
        resetSuratMasukFile();
    }

    /**
     * Penanganan pemilihan berkas PDF pada formulir unggah
     */
    function onSuratMasukFileSelected(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;

        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            showToast('Hanya berkas format PDF yang diperbolehkan!', 'error');
            resetSuratMasukFile();
            return;
        }

        // Batasi ukuran maksimal 25 MB
        if (file.size > 25 * 1024 * 1024) {
            showToast('Ukuran berkas terlalu besar! Maksimal ukuran adalah 25 MB.', 'error');
            resetSuratMasukFile();
            return;
        }

        var promptEl = document.getElementById('smFilePrompt');
        var infoEl = document.getElementById('smFileSelectedInfo');
        var nameEl = document.getElementById('smSelectedFileName');
        var sizeEl = document.getElementById('smSelectedFileSize');

        if (promptEl) promptEl.style.display = 'none';
        if (infoEl) infoEl.style.display = 'flex';
        if (nameEl) nameEl.textContent = file.name;

        var sizeStr = '';
        if (file.size > 1048576) {
            sizeStr = (file.size / 1048576).toFixed(1) + ' MB';
        } else {
            sizeStr = Math.round(file.size / 1024) + ' KB';
        }
        if (sizeEl) sizeEl.textContent = sizeStr;

        var hiddenName = document.getElementById('smHiddenFileName');
        var hiddenSize = document.getElementById('smHiddenFileSize');
        if (hiddenName) hiddenName.value = file.name;
        if (hiddenSize) hiddenSize.value = sizeStr;

        var reader = new FileReader();
        reader.onload = function (evt) {
            var hiddenBase64 = document.getElementById('smHiddenBase64');
            if (hiddenBase64) hiddenBase64.value = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    /**
     * Mereset input berkas surat masuk
     */
    function resetSuratMasukFile() {
        var input = document.getElementById('smFileInput');
        if (input) input.value = '';
        var hiddenBase64 = document.getElementById('smHiddenBase64');
        var hiddenName = document.getElementById('smHiddenFileName');
        var hiddenSize = document.getElementById('smHiddenFileSize');
        if (hiddenBase64) hiddenBase64.value = '';
        if (hiddenName) hiddenName.value = '';
        if (hiddenSize) hiddenSize.value = '';

        var promptEl = document.getElementById('smFilePrompt');
        var infoEl = document.getElementById('smFileSelectedInfo');
        if (promptEl) promptEl.style.display = 'block';
        if (infoEl) infoEl.style.display = 'none';
    }

    /**
     * Submit formulir unggah surat masuk ke backend
     */
    function submitSuratMasuk(e) {
        if (e && e.preventDefault) e.preventDefault();

        var noSurat = document.getElementById('smNomorSurat').value.trim();
        var pengirim = document.getElementById('smPengirim').value.trim();
        var perihal = document.getElementById('smPerihal').value.trim();
        var tglSurat = document.getElementById('smTanggalSurat').value;
        var tglTerima = document.getElementById('smTanggalTerima').value;
        var kategori = document.getElementById('smKategori').value;
        var keterangan = document.getElementById('smKeterangan').value.trim();
        var base64 = document.getElementById('smHiddenBase64').value;
        var fileName = document.getElementById('smHiddenFileName').value;
        var fileSize = document.getElementById('smHiddenFileSize').value;

        var alertEl = document.getElementById('smFormAlert');

        if (!noSurat || !pengirim || !perihal) {
            if (alertEl) {
                alertEl.style.display = 'block';
                alertEl.style.background = '#fef2f2';
                alertEl.style.border = '1px solid #fecaca';
                alertEl.style.color = '#dc2626';
                alertEl.textContent = 'Harap isi semua kolom wajib (*)!';
            }
            return;
        }

        if (!base64) {
            if (alertEl) {
                alertEl.style.display = 'block';
                alertEl.style.background = '#fef2f2';
                alertEl.style.border = '1px solid #fecaca';
                alertEl.style.color = '#dc2626';
                alertEl.textContent = 'Harap pilih berkas PDF surat masuk yang akan diunggah!';
            }
            return;
        }

        var btn = document.getElementById('btnSubmitSuratMasuk');
        var origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Mengunggah ke Google Drive...';

        var payload = {
            nomor_surat: noSurat,
            pengirim: pengirim,
            perihal: perihal,
            tanggal_surat: tglSurat,
            tanggal_terima: tglTerima,
            kategori: kategori,
            keterangan: keterangan,
            pdf_base64: base64,
            file_name: fileName,
            file_size: fileSize
        };

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                btn.innerHTML = origText;
                if (!res || !res.success) {
                    if (alertEl) {
                        alertEl.style.display = 'block';
                        alertEl.style.background = '#fef2f2';
                        alertEl.style.border = '1px solid #fecaca';
                        alertEl.style.color = '#dc2626';
                        alertEl.textContent = (res && res.message) || 'Gagal menyimpan surat masuk.';
                    }
                    showToast((res && res.message) || 'Gagal menyimpan surat masuk.', 'error');
                    return;
                }

                showToast('Surat masuk berhasil diarsipkan ke Google Drive!', 'success');
                closeModalUploadSuratMasuk();
                loadSuratMasuk();
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                btn.innerHTML = origText;
                if (alertEl) {
                    alertEl.style.display = 'block';
                    alertEl.style.background = '#fef2f2';
                    alertEl.style.border = '1px solid #fecaca';
                    alertEl.style.color = '#dc2626';
                    alertEl.textContent = 'Error koneksi: ' + (err && err.message ? err.message : err);
                }
                showToast('Error koneksi: ' + (err && err.message ? err.message : err), 'error');
            })
            .apiSimpanSuratMasuk(APP.token, payload);
    }

     * Membuka modal konfirmasi hapus surat masuk

    /**
     * Konfirmasi eksekusi hapus arsip surat masuk
     */
    function confirmHapusSuratMasuk() {
        var id = document.getElementById('deleteSmId').value;
        if (!id) return;

        var btn = document.getElementById('btnConfirmDeleteSm');
        var origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Menghapus...';

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                btn.innerHTML = origText;
                closeModalHapusSuratMasuk();
                if (!res || !res.success) {
                    showToast((res && res.message) || 'Gagal menghapus arsip.', 'error');
                    return;
                }
                showToast(res.message || 'Arsip berhasil dihapus.', 'success');
                loadSuratMasuk();
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                btn.innerHTML = origText;
                closeModalHapusSuratMasuk();
                showToast('Error koneksi: ' + (err && err.message ? err.message : err), 'error');
            })
            .apiHapusSuratMasuk(APP.token, id);
    }

    /**
     * Membuka pratinjau berkas surat masuk menggunakan modal reader
     */
    function previewSuratMasuk(id, nomorSurat) {
        if (!id) return;

        var spinner = document.getElementById('previewLoadingSpinner');
        var iframe = document.getElementById('previewIframe');
        var pdfWrap = document.getElementById('previewPdfWrap');
        var label = document.getElementById('previewNomorSuratLabel');
        var banner = document.getElementById('previewModalBanner');
        var toolbar = document.getElementById('previewModalToolbar');

        if (spinner) spinner.style.display = 'flex';
        if (iframe) { iframe.style.display = 'none'; iframe.srcdoc = ''; }
        if (pdfWrap) pdfWrap.style.display = 'none';
        if (banner) banner.style.display = 'none';
        if (toolbar) toolbar.style.display = 'none';
        if (label) label.textContent = nomorSurat ? '— [Surat Masuk] ' + nomorSurat : '';

        document.getElementById('modalPreviewSurat').style.display = 'flex';

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) {
                    if (spinner) spinner.style.display = 'none';
                    showToast('Gagal memuat pratinjau: ' + ((res && res.message) || 'Error'), 'error');
                    if (res && res.pdfUrl) {
                        window.open(res.pdfUrl, '_blank');
                    }
                    return;
                }

                if (label && res.nomorSurat) {
                    label.textContent = '— [Surat Masuk] ' + res.nomorSurat;
                }

                res.isSuratMasuk = true;
                renderUploadPdfPreviewModal(res);
                if (spinner) spinner.style.display = 'none';
            })
            .withFailureHandler(function (err) {
                if (spinner) spinner.style.display = 'none';
                showToast('Error: ' + (err && err.message ? err.message : err), 'error');
                document.getElementById('modalPreviewSurat').style.display = 'none';
            })
            .apiGetPreviewSuratMasuk(APP.token, id);
    }

    /**
     * Membuka modal formulir disposisi surat masuk bagi pejabat
     */
    function openModalDisposisi(idSuratMasuk) {
        var item = _suratMasukData.find(function (x) { return String(x.id_surat_masuk) === String(idSuratMasuk); });
        if (!item) {
            showToast('Data surat masuk tidak ditemukan!', 'error');
            return;
        }

        var modal = document.getElementById('modalDisposisiSurat');
        var form = document.getElementById('formDisposisiSurat');
        var alertEl = document.getElementById('dispAlert');
        if (form) form.reset();
        if (alertEl) { alertEl.style.display = 'none'; alertEl.textContent = ''; }

        document.getElementById('dispDocId').value = item.id_surat_masuk || '';
        document.getElementById('dispResNomor').textContent = item.nomor_surat || '-';
        document.getElementById('dispResPengirim').textContent = '🏛️ ' + (item.pengirim || '-');
        document.getElementById('dispResPerihal').textContent = 'Perihal: ' + (item.perihal || '-');
        document.getElementById('dispResTanggal').textContent = 'Tanggal Surat: ' + (item.tanggal_surat || '-') + ' | Diterima: ' + (item.tanggal_terima || '-');

        var pejabatNama = (APP.user && APP.user.nama) ? APP.user.nama : 'Pejabat Penelaah BAN PDM';
        document.getElementById('dispPejabatNama').textContent = pejabatNama;

        // Set radio sifat
        var sifat = item.disposisi_sifat || 'Biasa';
        var radio = document.querySelector('input[name="dispSifat"][value="' + sifat + '"]');
        if (radio) {
            radio.checked = true;
        } else {
            var defaultRadio = document.querySelector('input[name="dispSifat"][value="Biasa"]');
            if (defaultRadio) defaultRadio.checked = true;
        }

        // Set input Diteruskan Kepada & checkboxes
        var kepadaVal = item.disposisi_kepada || '';
        document.getElementById('dispKepada').value = kepadaVal;
        var kepadaCbs = document.querySelectorAll('input[name="dispKepadaQuick"]');
        kepadaCbs.forEach(function (cb) {
            cb.checked = kepadaVal.indexOf(cb.value) !== -1;
        });

        // Set input Petunjuk / Instruksi & checkboxes
        var instruksiVal = item.disposisi_instruksi || '';
        document.getElementById('dispInstruksi').value = instruksiVal;
        var instruksiCbs = document.querySelectorAll('input[name="dispInstruksiQuick"]');
        instruksiCbs.forEach(function (cb) {
            cb.checked = instruksiVal.indexOf(cb.value) !== -1;
        });

        // Set catatan khusus
        document.getElementById('dispCatatan').value = item.disposisi_catatan || '';

        if (modal) modal.style.display = 'flex';
    }

    /**
     * Menutup modal formulir disposisi surat
     */
    function closeModalDisposisi() {
        var modal = document.getElementById('modalDisposisiSurat');
        if (modal) modal.style.display = 'none';
    }

    /**
     * Sinkronisasi pilihan checkbox Diteruskan Kepada ke input text
     */
    function syncDisposisiKepada() {
        var checked = [];
        var cbs = document.querySelectorAll('input[name="dispKepadaQuick"]:checked');
        cbs.forEach(function (cb) { checked.push(cb.value); });
        document.getElementById('dispKepada').value = checked.join(', ');
    }

    /**
     * Sinkronisasi pilihan checkbox Petunjuk/Instruksi ke input textarea
     */
    function syncDisposisiInstruksi() {
        var checked = [];
        var cbs = document.querySelectorAll('input[name="dispInstruksiQuick"]:checked');
        cbs.forEach(function (cb) { checked.push(cb.value); });
        document.getElementById('dispInstruksi').value = checked.join(';\n');
    }

    /**
     * Menyimpan data disposisi surat oleh pejabat ke backend Google Apps Script
     */
    function submitDisposisi(e) {
        if (e && e.preventDefault) e.preventDefault();

        var idSuratMasuk = document.getElementById('dispDocId').value;
        var radioSifat = document.querySelector('input[name="dispSifat"]:checked');
        var sifat = radioSifat ? radioSifat.value : 'Biasa';
        var kepada = document.getElementById('dispKepada').value.trim();
        var instruksi = document.getElementById('dispInstruksi').value.trim();
        var catatan = document.getElementById('dispCatatan').value.trim();

        var alertEl = document.getElementById('dispAlert');

        // Fallback defensif: jika input teks kosong namun ada checkbox yang dicentang
        if (!kepada) {
            var checkedKepada = [];
            var cbs = document.querySelectorAll('input[name="dispKepadaQuick"]:checked');
            cbs.forEach(function (cb) { checkedKepada.push(cb.value); });
            if (checkedKepada.length > 0) {
                kepada = checkedKepada.join(', ');
                document.getElementById('dispKepada').value = kepada;
            }
        }

        if (!kepada) {
            if (alertEl) {
                alertEl.style.display = 'block';
                alertEl.style.background = '#fef2f2';
                alertEl.style.border = '1px solid #fecaca';
                alertEl.style.color = '#dc2626';
                alertEl.textContent = 'Harap tentukan penerima disposisi (Diteruskan Kepada)!';
            }
            return;
        }

        var btn = document.getElementById('btnSubmitDisposisi');
        var origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Menyimpan Disposisi...';

        var disposisiData = {
            kepada: kepada,
            sifat: sifat,
            instruksi: instruksi,
            catatan: catatan,
            disposisi_kepada: kepada,
            disposisi_sifat: sifat,
            disposisi_instruksi: instruksi,
            disposisi_catatan: catatan
        };

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                btn.innerHTML = origText;
                if (!res || !res.success) {
                    if (alertEl) {
                        alertEl.style.display = 'block';
                        alertEl.style.background = '#fef2f2';
                        alertEl.style.border = '1px solid #fecaca';
                        alertEl.style.color = '#dc2626';
                        alertEl.textContent = (res && res.message) || 'Gagal menyimpan disposisi.';
                    }
                    showToast((res && res.message) || 'Gagal menyimpan disposisi.', 'error');
                    return;
                }

                showToast('Disposisi surat berhasil disimpan!', 'success');
                closeModalDisposisi();
                loadSuratMasuk();
                loadDashboard();
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                btn.innerHTML = origText;
                if (alertEl) {
                    alertEl.style.display = 'block';
                    alertEl.style.background = '#fef2f2';
                    alertEl.style.border = '1px solid #fecaca';
                    alertEl.style.color = '#dc2626';
                    alertEl.textContent = 'Error koneksi: ' + (err && err.message ? err.message : err);
                }
                showToast('Error koneksi: ' + (err && err.message ? err.message : err), 'error');
            })
            .apiSimpanDisposisi(APP.token, idSuratMasuk, disposisiData);
    }

    /**
     * Membuka modal pratinjau lembar disposisi resmi untuk dilihat atau dicetak
     */
    function openLembarDisposisi(idSuratMasuk) {
        var item = _suratMasukData.find(function (x) { return String(x.id_surat_masuk) === String(idSuratMasuk); });
        if (!item) {
            showToast('Data surat masuk tidak ditemukan!', 'error');
            return;
        }

        document.getElementById('printSmPengirim').textContent = item.pengirim || '-';
        document.getElementById('printSmTglTerima').textContent = item.tanggal_terima || '-';
        document.getElementById('printSmNomor').textContent = item.nomor_surat || '-';
        document.getElementById('printSmTglSurat').textContent = item.tanggal_surat || '-';
        document.getElementById('printSmPerihal').textContent = item.perihal || '-';
        document.getElementById('printSmSifatVal').textContent = item.disposisi_sifat || 'Biasa';
        document.getElementById('printSmKepada').textContent = item.disposisi_kepada || '-';
        document.getElementById('printSmInstruksi').textContent = item.disposisi_instruksi || '-';
        document.getElementById('printSmCatatan').textContent = item.disposisi_catatan || '— (Tidak ada catatan khusus) —';

        var tglDisp = item.disposisi_tgl ? item.disposisi_tgl.split(' ')[0] : new Date().toLocaleDateString('id-ID');
        document.getElementById('printSmTglDisposisi').textContent = 'Kupang, ' + tglDisp;
        document.getElementById('printSmPejabatNama').textContent = item.disposisi_oleh || (APP.user ? APP.user.nama : 'Dr. Arifin Djenawa, M.Pd');

        var modal = document.getElementById('modalLembarDisposisi');
        if (modal) modal.style.display = 'flex';
    }

    /**
     * Menutup modal lembar disposisi resmi
     */
    function closeLembarDisposisi() {
        var modal = document.getElementById('modalLembarDisposisi');
        if (modal) modal.style.display = 'none';
    }

    /**
     * Mencetak lembar disposisi resmi
     */
    function printLembarDisposisi() {
        window.print();
    }
</script>
